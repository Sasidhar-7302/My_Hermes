<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hermes Watch HUD</title>
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/companions/smartwatch/manifest.json">
    <link rel="apple-touch-icon" href="/companions/icon-192.png">
    <link rel="icon" type="image/png" href="/companions/icon-192.png">
    <link rel="stylesheet" href="/companions/smartwatch/web/watch.css">
</head>
<body>
    <div class="watch-display">
        <!-- Toast popup overlay -->
        <div id="watch-toast" class="watch-toast">Wrist Connected</div>

        <!-- Top Header Arc: Time, Connectivity, Battery -->
        <div class="watch-header">
            <div class="header-top">
                <div class="status-badge">
                    <span id="status-dot" class="status-dot"></span>
                    <span id="status-text">HERMES WATCH HUD</span>
                </div>
                <div id="battery-pill" class="battery-pill">🔋 --%</div>
            </div>
            <div id="watch-clock" class="watch-clock">12:00</div>
        </div>

        <!-- Center Hero: Push to Send Voice Note Core -->
        <div class="voice-hero">
            <div class="voice-ripple-container">
                <div class="voice-ripple r1"></div>
                <div class="voice-ripple r2"></div>
                <button id="voice-core-btn" class="voice-core-btn" aria-label="Push to send voice note">
                    <div class="sound-wave" id="sound-wave">
                        <span class="bar b1"></span>
                        <span class="bar b2"></span>
                        <span class="bar b3"></span>
                        <span class="bar b4"></span>
                        <span class="bar b5"></span>
                    </div>
                    <span class="mic-icon" id="mic-icon">🎙️</span>
                </button>
            </div>
            <div id="voice-caption" class="voice-caption">Hold to Talk</div>
        </div>

        <!-- Flanking Essential Bottom Action Chips -->
        <div class="watch-actions">
            <button class="action-chip" onclick="grabPcClipboard()" title="Grab PC Clipboard">
                <span class="chip-icon">📋</span>
                <span class="chip-label">Clip</span>
            </button>
            <button class="action-chip" onclick="peekDesktopScreen()" title="Watch Hermes Work">
                <span class="chip-icon">🖥️</span>
                <span class="chip-label">Peek</span>
            </button>
            <button class="action-chip" onclick="openWatchDeck()" title="Wrist Control Deck (Media, Find Phone, Deals)">
                <span class="chip-icon">🎛️</span>
                <span class="chip-label">Deck</span>
            </button>
            <button class="action-chip" onclick="wakePcFromWatch()" title="Wake PC (WoL)">
                <span class="chip-icon">⚡</span>
                <span class="chip-label">Wake</span>
            </button>
            <button class="action-chip panic" onclick="panicStop()" title="Emergency Panic Stop">
                <span class="chip-icon">🚨</span>
                <span class="chip-label">Stop</span>
            </button>
        </div>

        <!-- Slide-up Wrist Control Deck Modal (PC Media, Find Phone, Slickdeals, Fullscreen) -->
        <div id="deck-modal" class="reply-modal" onclick="dismissWatchDeck()">
            <div class="modal-card" style="padding: 10px; max-height: 90%; overflow-y: auto;" onclick="event.stopPropagation()">
                <div class="modal-header">
                    <span class="modal-tag">🎛️ WRIST DECK</span>
                    <span class="modal-close" onclick="dismissWatchDeck()">&times;</span>
                </div>
                <!-- PC Media & Volume Bar -->
                <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px;">
                    <button onclick="watchMediaControl('mute')" style="background:#111b24;border:1px solid #1e293b;border-radius:8px;padding:7px 2px;font-size:13px;color:#fff;cursor:pointer;">🔇</button>
                    <button onclick="watchMediaControl('volume_down')" style="background:#111b24;border:1px solid #1e293b;border-radius:8px;padding:7px 2px;font-size:13px;color:#fff;cursor:pointer;">🔉</button>
                    <button onclick="watchMediaControl('play_pause')" style="background:rgba(16,185,129,0.22);border:1px solid #10b981;border-radius:8px;padding:7px 2px;font-size:13px;color:#fff;cursor:pointer;">⏯️</button>
                    <button onclick="watchMediaControl('volume_up')" style="background:#111b24;border:1px solid #1e293b;border-radius:8px;padding:7px 2px;font-size:13px;color:#fff;cursor:pointer;">🔊</button>
                    <button onclick="watchMediaControl('next')" style="background:#111b24;border:1px solid #1e293b;border-radius:8px;padding:7px 2px;font-size:13px;color:#fff;cursor:pointer;">⏭️</button>
                </div>
                <!-- Quick Actions Row: Find Phone, Top Deals, Fullscreen -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 6px;">
                    <button onclick="pingPhoneFromWatch()" style="background:rgba(56,189,248,0.18);border:1px solid #38bdf8;border-radius:8px;padding:7px 4px;font-size:10px;font-weight:700;color:#e0f2fe;cursor:pointer;">📱 Find Phone</button>
                    <button onclick="loadWatchHotDeals()" style="background:rgba(245,158,11,0.18);border:1px solid #f59e0b;border-radius:8px;padding:7px 4px;font-size:10px;font-weight:700;color:#fef3c7;cursor:pointer;">🔥 Slickdeals</button>
                </div>
                <button onclick="toggleWatchFullscreen()" style="width:100%;background:rgba(16,185,129,0.15);border:1px solid #10b981;border-radius:8px;padding:6px;font-size:10px;font-weight:700;color:#10b981;cursor:pointer;margin-bottom:6px;">⛶ Full-Screen Wrist App Mode</button>
                <!-- Compact Deals List on Wrist -->
                <div id="watch-deals-box" style="display:none;flex-direction:column;gap:4px;max-height:95px;overflow-y:auto;text-align:left;"></div>
            </div>
        </div>

        <!-- Slide-up Desktop Screen Peek Modal (Watch Hermes Work) -->
        <div id="screen-modal" class="reply-modal" onclick="dismissScreenModal()">
            <div class="modal-card" style="padding: 10px; max-height: 88%;">
                <div class="modal-header">
                    <span class="modal-tag">📺 WATCH HERMES</span>
                    <span class="modal-close">&times;</span>
                </div>
                <div id="watch-screen-focus" style="font-size: 10px; color: var(--accent-emerald); font-weight: 700; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Focused: Desktop</div>
                <img id="watch-screen-img" src="" style="width: 100%; max-height: 130px; object-fit: contain; border-radius: 8px; border: 1px solid var(--card-border); background: #000;" alt="PC Screen" onclick="event.stopPropagation(); refreshWatchScreen();">
                <div class="modal-hint" style="margin-top: 6px;">Tap image to refresh • Tap outside to close</div>
            </div>
        </div>

        <!-- Slide-up Agent Reply Modal -->
        <div id="reply-modal" class="reply-modal" onclick="dismissReplyModal()">
            <div class="modal-card">
                <div class="modal-header">
                    <span class="modal-tag">⚡ HERMES REPLY</span>
                    <span class="modal-close">&times;</span>
                </div>
                <div id="reply-text" class="reply-text">Ready on wrist</div>
                <div class="modal-hint">Tap anywhere to dismiss</div>
            </div>
        </div>
    </div>

    <script src="/companions/smartwatch/web/watch.js"></script>
</body>
</html>
